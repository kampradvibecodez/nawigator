<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1527">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
<title>Nawigator Rzeszów</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#040816;--pan:#0e1527;--btn:#1b2435;--line:#26334a;--fg:#fff;--lab:#8fa3bf;--teal:#0e4d5e;--row:#144458;--amber:#d2880b;--red:#bb2524;--blue:#2454da;--yel:#f2c230;--grn:#1e9e4a}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
@supports(height:100dvh){html,body,#drive,#pick{height:100dvh}}
body{background:var(--bg);color:var(--fg);font:16px/1.25 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
small{font-size:.68rem;letter-spacing:.06em;color:var(--lab);font-weight:600;text-transform:uppercase}
/* wybór kursu */
#pick{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch;background:#06101f}
.warn{background:#3a2a00;border-left:4px solid var(--amber);padding:10px 12px;margin:0 0 12px;font-size:.95rem}
.ob,.gb{display:block;width:100%;padding:16px;border:0;border-radius:14px;font-weight:800;font-size:1.05rem;text-transform:uppercase;margin:0 0 12px}
.ob{background:#f59e0b;color:#111827}.gb{background:#22c55e;color:#052e16}
#logo{width:92px;height:84px;border-radius:14px;background:#e11d48;color:#fff;font-weight:800;font-size:1.9rem;display:flex;align-items:center;justify-content:center;margin:6px 0 20px}
h1{font-size:2rem;margin:0 0 6px;font-weight:800}.sub{color:var(--lab);font-size:1.15rem;margin:0 0 22px}
.lab{display:block;margin:6px 0 8px;font-weight:700;color:#c3cde0;text-transform:uppercase;font-size:.95rem}
.two{display:flex;gap:12px;margin-bottom:16px}.two>*{flex:1;min-width:0}
select{width:100%;background:#f8fafc;color:#0f172a;border:0;border-radius:14px;padding:16px;font-size:1.6rem;font-weight:800;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none}
#kc{background:#0e1628;border-radius:14px;padding:16px 18px;margin-bottom:12px;font-weight:800;font-size:1.2rem;line-height:1.5}
#k3{font-weight:500;color:#c3cde0;font-size:1.05rem}
/* jazda */
#drive{display:none;flex-direction:column;height:100%}
#top{display:flex;align-items:stretch;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--pan)}
#menu{background:var(--amber);color:#111;border:0;border-radius:12px;font-weight:800;padding:0 14px}
#lt{background:#9d640d;border-radius:12px;min-width:58px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-size:2.1rem;font-weight:800}
#top .bl{display:flex;flex-direction:column;justify-content:center;min-width:0}
#dirn,#brn{font-size:1.15rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dir{flex:1;min-width:0}#brw{text-align:right}
#etap{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#0d1626;font-size:.95rem}
#etap b{font-weight:700}#kind{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brk{color:var(--yel);font-weight:800;white-space:nowrap}
#mapw{position:relative;overflow:hidden;background:#222;min-height:130px;flex:1 1 0}
#map{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);transition:transform .35s linear}
#attr{position:absolute;left:4px;bottom:2px;z-index:500;font:11px Arial,sans-serif;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:3px}
#dp{position:absolute;right:8px;bottom:8px;z-index:600;background:rgba(11,18,32,.88);border-radius:12px;padding:6px 14px;text-align:right}
#dpm{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}
#off{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:650;background:var(--red);border-radius:10px;padding:5px 14px;font-weight:800;display:none}
#toast{position:absolute;left:8px;right:8px;top:8px;z-index:640;background:rgba(11,18,32,.92);border-left:5px solid var(--amber);border-radius:10px;padding:8px 12px;font-weight:700;display:none}
#ctl{display:flex;gap:8px;padding:8px 8px 0}
#ctl>*{background:var(--btn);border:1px solid var(--line);border-radius:12px;height:46px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.95rem;padding:0 12px;text-transform:uppercase}
#ctl .w{flex:1}
#ctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#snd[aria-pressed=true]{background:var(--grn);border-color:var(--grn)}
#gdot{width:12px;height:12px;border-radius:50%;background:#888}
#gdot.g{background:#2ecc71}#gdot.o{background:#f5a623}#gdot.r{background:#e74c3c}
#cs{display:flex;gap:10px;margin:8px;padding:10px 14px;background:var(--teal);border-radius:14px}
#cs .l{flex:1;min-width:0}#csname{display:block;font-size:1.45rem;font-weight:700;line-height:1.15;margin-top:2px}
#cs .r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:2px}
#csn{font-weight:700;font-size:.9rem;color:#cfe3ef}#cst{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-weight:800;letter-spacing:.06em;color:#fff}
.tag.s{background:var(--red)}.tag.n{background:var(--blue)}
#csb{height:46px;min-width:112px;font-size:1.5rem}
#low{display:flex;gap:8px;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
#lcol{flex:0 0 31%;display:flex;flex-direction:column;gap:6px}
#dly{flex:1;min-height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;background:#555}
#dly.late{background:#bc2222}#dly.ok{background:var(--grn)}#dly.early{background:#c99700}
#lcol button{height:42px;border:0;border-radius:12px;font-weight:800;text-transform:uppercase;font-size:.85rem;background:#9c640f;color:#1a1204}
#fol[aria-pressed=true]{background:var(--amber)}
#fol[aria-pressed=false]{background:var(--btn);color:var(--fg);border:1px solid var(--line)}
#radio.on{background:var(--grn);color:#fff}
#rcol{flex:1;min-width:0;display:flex;flex-direction:column}
#list{overflow-y:auto;max-height:168px;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.row{display:flex;gap:8px;align-items:center;padding:6px 10px;margin-top:6px;background:var(--row);border-radius:12px;min-height:44px;font-size:1rem;font-weight:600}
.row span.n{flex:1;min-width:0;line-height:1.15}
.row .tag{flex:0 0 58px;height:30px;font-size:.85rem}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:.1}}
.tag.blink{animation:bl .8s linear infinite}
.sheet{position:fixed;inset:0;z-index:2000;background:rgba(11,18,32,.97);padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));overflow:auto;display:none}
.sheet.on{display:block}.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:1.3rem}
.x{background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700}
#rq{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-size:1.1rem;margin-bottom:8px}
#np{min-height:24px;color:var(--yel);font-weight:700;margin-bottom:6px}.dim{color:var(--lab)}
.st{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 8px;background:none;border:0;border-bottom:1px solid var(--line)}
.hs{display:block;opacity:.85;transition:transform .2s;transform:rotate(var(--ur,0deg))}
.hs.past{opacity:.35}.hs.cur{opacity:1;transform:rotate(var(--ur,0deg)) scale(1.6);filter:drop-shadow(0 0 4px rgba(255,176,0,.95))}
.me svg{display:block;transition:transform .3s;filter:drop-shadow(0 0 3px #000)}
</style></head><body>
<section id="pick">
 <button class="ob" id="back" style="display:none">Wstecz do mapy</button>
 <div id="logo">MPK</div>
 <h1>Nawigator Rzeszów</h1><p class="sub">Nawigacja po trasach i brygadach dla kierowców autobusów miejskich.</p>
 <div id="warn"></div>
 <div class="two"><div><span class="lab">Linia</span><select id="br" aria-label="Linia"></select></div><div><span class="lab">Brygada</span><select id="bg" aria-label="Brygada"></select></div></div>
 <span class="lab">Kurs do startu</span>
 <div id="kc"><div id="k1"></div><div id="k2"></div><div id="k3"></div></div>
 <div class="two"><button class="ob" id="kp">‹ Kurs</button><button class="ob" id="kn">Kurs ›</button></div>
 <button class="gb" id="go">Start tego kursu</button>
</section>
<section id="drive">
 <div id="top"><button id="menu">MENU</button><div id="lt">–</div>
  <div class="bl" id="dir"><small>Kierunek</small><div id="dirn"></div></div>
  <div class="bl" id="brw"><small>Bryg.</small><div id="brn"></div></div></div>
 <div id="etap"><small>Etap zmiany</small><b id="et"></b><span id="kind"></span><span id="brk"></span></div>
 <div id="mapw"><div id="map"></div><div id="attr">© OpenStreetMap</div><div id="off">POZA TRASĄ</div><div id="toast"></div><div id="dp"><small>Do przystanku</small><span id="dpm">—</span></div></div>
 <div id="ctl"><div><i id="gdot"></i>GPS</div><button id="snd" aria-pressed="false">Głos</button>
  <button id="prev" class="w"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Prz.</button>
  <button id="next" class="w">Prz.<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
 <div id="cs"><div class="l"><small id="cslab">Aktualny przystanek</small><b id="csname"></b></div>
  <div class="r"><span id="csn"></span><span id="cst"></span><span id="csb" class="tag s">STOP</span></div></div>
 <div id="low">
  <div id="lcol"><div id="dly">–</div><button id="radio">Radio</button><button id="fol" aria-pressed="false">Nie wyśrodkowano</button></div>
  <div id="rcol"><small>Lista</small><div id="list"></div></div></div>
 <div class="sheet" id="radioP"></div>
</section>
