<title>Nawigator Rzeszów</title>

<style>

#fol[aria-pressed=true]{background:var(--amber)}

 <div id="low">

function icon(m){const t=m[3],W='#fff',G='#6b7a93',f1=n=>n.toFixed(1);

const setIcon=m=>{const k=m?[m[3],m[4],m[7]].join():'';if(setIcon.k!==k){setIcon.k=k;$('#mi').innerHTML=m?icon(m):''}};
/* ronda z OpenStreetMap (Overpass): lista pierścieni z wyjazdami, zapamiętywana w telefonie */
const OV=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];let RBD=null;
const bear=(p,q)=>(Math.atan2((q[1]-p[1])*Math.cos(p[0]*Math.PI/180),q[0]-p[0])*180/Math.PI+360)%360;
function psd(y,x,a,b){const k=Math.cos(y*Math.PI/180)*111320,vx=(b[1]-a[1])*k,vy=(b[0]-a[0])*110540,wx=(x-a[1])*k,wy=(y-a[0])*110540,L=vx*vx+vy*vy,t=L?Math.max(0,Math.min(1,(vx*wx+vy*wy)/L)):0;return Math.hypot(wx-t*vx,wy-t*vy)}
function rdist(R,p){let m=1e9;for(let i=0;i<R.p.length;i++)m=Math.min(m,psd(p[0],p[1],R.p[i],R.p[(i+1)%R.p.length]));return m}
function cnode(R,p,ex){let b=-1,bd=40;R.p.forEach((q,j)=>{if(!(ex?q[2]:q[3]))return;const d=dist(p[0],p[1],q[0],q[1]);if(d<bd){bd=d;b=j}});return b}
function buildRB(els){
 const ways=els.filter(e=>e.type==='way'),isR=w=>/^(roundabout|circular)$/.test(w.tags?.junction||''),ring=ways.filter(w=>isR(w)&&w.geometry),con=ways.filter(w=>!isR(w));
 const ex=new Set(),an=new Set(),rn=new Set();ring.forEach(w=>w.nodes.forEach(n=>rn.add(n)));
 for(const w of con){const T=w.tags||{},hw=T.highway||'';
  if(/^(footway|path|cycleway|pedestrian|steps|track|bridleway|corridor|construction|proposed|platform)$/.test(hw))continue;
  if(T.motor_vehicle==='no'||/^(no|private)$/.test(T.access||''))continue;
  if(hw==='service'&&/^(driveway|parking_aisle|emergency_access)$/.test(T.service||''))continue;
  const ow=/^(yes|1|true)$/.test(T.oneway||''),rv=T.oneway==='-1',n=w.nodes;
  n.forEach((id,i)=>{if(!rn.has(id))return;an.add(id);if(ow?i===0:rv?i===n.length-1:true)ex.add(id)})}
 const byFirst=new Map();ring.forEach(w=>byFirst.set(w.nodes[0],w));const used=new Set(),out=[];
 for(const w0 of ring){if(used.has(w0))continue;const seq=[];let w=w0,g=0;
  while(w&&!used.has(w)&&g++<12){used.add(w);w.nodes.forEach((id,i)=>{if(seq.length&&i===0)return;seq.push([w.geometry[i].lat,w.geometry[i].lon,id])});w=byFirst.get(w.nodes[w.nodes.length-1])}
  if(seq.length>1&&seq[0][2]===seq.at(-1)[2])seq.pop();if(seq.length<4)continue;
  const c=[seq.reduce((a,q)=>a+q[0],0)/seq.length,seq.reduce((a,q)=>a+q[1],0)/seq.length],r=seq.reduce((a,q)=>a+dist(c[0],c[1],q[0],q[1]),0)/seq.length;
  if(r>80)continue;out.push({c,r,p:seq.map(q=>[+q[0].toFixed(6),+q[1].toFixed(6),ex.has(q[2])?1:0,an.has(q[2])?1:0])})}
 return out}
async function loadRB(){
 try{const c=JSON.parse(localStorage.getItem('rbd2')||'null');if(c&&Date.now()-c.t<30*864e5){RBD=c.d;if(trip)initShape();return}}catch(e){}
 let a=[90,180],b=[-90,-180];for(const s of D.stops){a=[Math.min(a[0],s[1]),Math.min(a[1],s[2])];b=[Math.max(b[0],s[1]),Math.max(b[1],s[2])]}
 const bb=[a[0]-.01,a[1]-.01,b[0]+.01,b[1]+.01].map(v=>v.toFixed(4)).join(','),
  q='[out:json][timeout:90];way["junction"~"^(roundabout|circular)$"]('+bb+')->.r;node(w.r)->.rn;way(bn.rn)["highway"]->.c;.r out geom;.c out body;';
 for(const u of OV){try{const r=await fetch(u+'?data='+encodeURIComponent(q));if(!r.ok)continue;RBD=buildRB((await r.json()).elements);try{localStorage.setItem('rbd2',JSON.stringify({t:Date.now(),d:RBD}))}catch(e){}if(trip)initShape();return}catch(e){}}}
function rbEvents(){const sh=D.shapes[trip[5]];if(!RBD||!sh||cd.length<2)return[];
 const tot=cd[cd.length-1],S=[],out=[];let i=0;
 for(let s=0;s<=tot;s+=4){while(i<cd.length-2&&cd[i+1]<s)i++;const L=cd[i+1]-cd[i]||1,t=(s-cd[i])/L;S.push([sh[i][0]+(sh[i+1][0]-sh[i][0])*t,sh[i][1]+(sh[i+1][1]-sh[i][1])*t,s])}
 for(const R of RBD){const near=S.filter(p=>dist(R.c[0],R.c[1],p[0],p[1])<=R.r+15);if(near.length<3)continue;
  const runs=[];let cr=[];for(const p of near){if(cr.length&&p[2]-cr.at(-1)[2]>12){runs.push(cr);cr=[]}cr.push(p)}if(cr.length)runs.push(cr);
  for(const run of runs){const on=run.filter(p=>rdist(R,p)<=12);if(on.length<2)continue;const a=on[0],b=on.at(-1);if(b[2]-a[2]<8)continue;
   const f=((bear(ptAt(b[2]+3),ptAt(b[2]+25))-bear(ptAt(a[2]-25),ptAt(a[2]-3))+540)%360)-180,ei=cnode(R,a,0),xi=cnode(R,b,1);let x=0;
   if(ei>=0&&xi>=0){const n=R.p.length;let j=ei,k=0;do{j=(j+1)%n;if(R.p[j][2])x++;k++}while(j!==xi&&k<=n)}
   out.push({lat:a[0],lon:a[1],s0:a[2],s1:b[2],f:Math.round(f),x:x>0&&x<=8?x:0})}}
 return out}
function withRB(ms){if(!RBD||!ms.length)return ms;const ev=rbEvents();if(!ev.length)return ms;
 const out=ms.filter(m=>!ev.some(e=>m[2]>=e.s0-45&&m[2]<=e.s1+45));for(const e of ev)out.push([e.lat,e.lon,e.s0,'rotary','',e.x,'',e.f]);return out.sort((a,b)=>a[2]-b[2])}
const R=new Audio();R.preload='none';
function pauseRadio(){if(radioOn&&!R.paused){R.pause();rdPaused=true}}
function resumeRadio(){setTimeout(()=>{if(rdPaused&&radioOn&&!speechSynthesis.speaking&&A.paused){rdPaused=false;R.play().catch(()=>{})}},500)}
const say=t=>{if(!snd||!window.speechSynthesis)return;pauseRadio();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';u.onend=u.onerror=resumeRadio;speechSynthesis.speak(u)};
const A=new Audio();A.onended=resumeRadio;A.onerror=()=>{$('#mt').textContent='Brak pliku dźwiękowego: '+A.src.split('/').pop()};
const play=n=>{if(!snd)return;pauseRadio();A.src='audio/'+n+'.mp3';A.play().catch(()=>{$('#snd').textContent='Głos ?'})};
function announce(k){const n=trip[6].length;play(k===n-1?'przystanek_koncowy_kursu':trip[8][k]?'na_zadanie':'przystanek_obowiazkowy')}
function pr(y,x,lo,hi,first){const sh=D.shapes[trip[5]];if(!sh||sh.length<2)return[lo,1e9];const k=Math.cos(y*Math.PI/180)*111320,c=[];
 for(let i=0;i<sh.length-1;i++){if(cd[i+1]<lo||cd[i]>hi)continue;const a=sh[i],b=sh[i+1],vx=(b[1]-a[1])*k,vy=(b[0]-a[0])*110540,wx=(x-a[1])*k,wy=(y-a[0])*110540,L=vx*vx+vy*vy,t=L?Math.max(0,Math.min(1,(vx*wx+vy*wy)/L)):0;c.push([Math.hypot(wx-t*vx,wy-t*vy),cd[i]+t*Math.sqrt(L)])}
 if(!c.length)return[lo,1e9];let b=c[0];for(const z of c)if(z[0]<b[0])b=z;
 if(first)b=c.filter(z=>z[0]<=b[0]+15).reduce((p,z)=>z[1]<p[1]?z:p);return[b[1],b[0]]}
function initShape(){const sh=D.shapes[trip[5]]||[];cd=[0];for(let i=1;i<sh.length;i++)cd.push(cd[i-1]+dist(sh[i-1][0],sh[i-1][1],sh[i][0],sh[i][1]));mn=withRB(D.man[trip[5]]||[]);
 sa=[];let pv=0;for(const i of trip[6]){const s=D.stops[i],r=pr(s[1],s[2],pv-30,pv+3000,0)[0];sa.push(r);pv=Math.max(pv,r)}manv()}
function proj(y,x){if(!D.shapes[trip[5]])return;let[r,d]=started?pr(y,x,al-150,al+1000,0):pr(y,x,-1,1e9,1);
 if(started&&(d>60||recov)){const g=pr(y,x,al-300,1e9,1);if(g[1]<=40||(recov&&g[1]<d)){r=g[0];d=g[1]}}   // po utracie GPS szukamy dalej na całej trasie

 if(!off){al=r;started=true;advance()}onRt=!off&&started;manv(off);blinkUpdate();
 if(!off&&started&&!fin&&cur===trip[6].length-1&&sa[cur]-al<=20){fin=true;const t0=trip;setTimeout(()=>{if(trip===t0&&si<shift.length-1){si++;open(shift[si])}},4000)}}
const BL=200; // m przed przystankiem, od których STOP mruga
function blinkUpdate(){const e=$('#csb');e.classList.toggle('blink',started&&!trip[8][cur]&&sa[cur]-al<=BL&&sa[cur]-al>-25);

function manv(off){const B=$('#mt');if(!mn.length){B.textContent='Brak sprawdzonych instrukcji skrętów dla tej trasy';setIcon(null);return}

 if(d>500){B.textContent=pre+'Jedź dalej prosto';setIcon(STR);if(!off&&!said['S'+m[2]]){said['S'+m[2]]=1;say('Jedź dalej prosto')}return}

 if(off)return;const th=[50,200,500].find(h=>d<=h);
 if(th&&!said[m[2]+'_'+th]){[50,200,500].filter(h=>h>=th).forEach(h=>said[m[2]+'_'+h]=1);say(th===50?msay(m):'Za '+th+' metrów. '+msay(m))}}
$('#snd').onclick=e=>{snd=!snd;e.target.setAttribute('aria-pressed',snd);e.target.textContent='Głos';if(snd){say('Głos włączony');play('przystanek_obowiazkowy')}};
const RT_URL='https://www.mpkrzeszow.pl/gtfs/rt/gtfsrt.pb'; // przy błędzie CORS wstaw adres Workera (worker.js)
const td=new TextDecoder();
function pb(b){const o={};let i=0;const v=()=>{let r=0,s=0,c;do{c=b[i++];if(s<32)r|=(c&127)<<s;s+=7}while(c&128);return r>>>0};

async function pollRT(){try{

  const u=tu[2]&&pb(tu[2][0]);if(!u)continue;const dd=u[3]||u[2];m[id]={seq:u[1]?.[0],delay:dd?(pb(dd[0])[1]?.[0]|0):0}}
 rt=m;rtT=Date.now();const q=trip&&rt[trip[9]];
 if(q&&!started&&q.seq!=null){const i=trip[10]?trip[10].indexOf(q.seq):q.seq-1;if(i>=0&&i<trip[6].length)cur=i}
 if(trip)render()}catch(e){rt={}}}

$('#prev').onclick=()=>{cur=Math.max(0,cur-1);render()};
$('#next').onclick=()=>{cur=Math.min(trip[6].length-1,cur+1);render()};
function layout(){const w=$('#mapw').clientWidth,h=$('#mapw').clientHeight,m=$('#map'),d=follow?Math.ceil(Math.hypot(w,h)):0;m.style.width=d?d+'px':'100%';m.style.height=d?d+'px':'100%';if(map)map.invalidateSize({animate:false})}
function spin(a){if(a==null)return;ang+=((a-ang)%360+540)%360-180;const m=$('#map');m.style.transform='translate(-50%,-50%) rotate('+(-ang)+'deg)';m.style.setProperty('--ur',ang+'deg')}
function ahead(y,x){const z=Math.max(map.getZoom(),16),c=Math.cos(y*Math.PI/180),m=$('#mapw').clientHeight*.2*156543*c/2**z,r=hd*Math.PI/180;return[y+Math.cos(r)*m/110540,x+Math.sin(r)*m/(111320*c)]}
