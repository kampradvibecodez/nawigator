<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171c">
<title>Nawigator Rzeszów</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#14171c;--panel:#1e232b;--line:#2f3641;--fg:#eef0f2;--dim:#9aa4b2;--amber:#ffb000;--red:#d32a00}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
@supports(height:100dvh){html,body,#drive,#pick{height:100dvh}}
body{background:var(--bg);color:var(--fg);font:16px/1.35 "Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,select{font:inherit;color:inherit}
#pick{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
h1{font-size:1.6rem;margin:0 0 12px;font-weight:600}
.warn{background:#3a2a00;border-left:4px solid var(--amber);padding:10px 12px;margin:0 0 12px;font-size:.95rem}
select{width:100%;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:8px 16px;border:1px solid var(--line);border-radius:20px;background:none;font-size:1.1rem}
.chip[aria-pressed=true]{background:var(--amber);color:#14171c;border-color:var(--amber)}
.trip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 4px;background:none;border:0;border-bottom:1px solid var(--line)}
.trip b{font-variant-numeric:tabular-nums;font-size:1.3rem;min-width:3.6em}
.badge{background:var(--red);color:#fff;border-radius:4px;padding:1px 8px;font-weight:600;min-width:2.4em;text-align:center}
.dim{color:var(--dim)}
#drive{display:none;flex-direction:column;height:100%}
#man{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-left:6px solid var(--amber);font-size:1.2rem;font-weight:600;line-height:1.2}
#mt{flex:1;min-width:0}
#mapw{position:relative;overflow:hidden;background:#222;min-height:0;flex:1 1 0}
#map{position:absolute;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);transition:transform .35s linear}
#attr{position:absolute;right:4px;bottom:2px;z-index:500;font:11px Arial,sans-serif;color:#333;background:rgba(255,255,255,.75);padding:0 4px;border-radius:3px}
#list{flex:0 0 auto;max-height:44%;max-height:44dvh;overflow:auto}
.row{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:1.1rem}
.row time{font-variant-numeric:tabular-nums;min-width:3.2em;color:var(--dim)}
.row.now{background:var(--amber);color:#14171c;font-size:1.45rem;font-weight:600;padding:10px 14px}
.row.now time{color:#14171c}
.stop{margin-left:auto;background:#d32a00;color:#fff;border:2px solid #fff;border-radius:4px;padding:1px 12px;font-weight:800;letter-spacing:.08em;font-size:1rem;white-space:nowrap}
.now .stop{font-size:1.2rem;padding:2px 14px}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:.1}}
.stop.blink{animation:bl .8s linear infinite}
.od{margin-left:auto;font-size:.8rem;border:1px solid currentColor;border-radius:4px;padding:0 6px;white-space:nowrap}
#bar{display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--panel);align-items:center}
#fol{flex:1}
#bar button[aria-pressed=true]{background:var(--amber);color:#14171c;border-color:var(--amber)}
#bar button{padding:12px 10px;font-size:.95rem;white-space:nowrap;background:none;border:1px solid var(--line);border-radius:6px}
#st{font-size:1.05rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.late{color:#ff453a}.ok{color:#32d74b}.early{color:#ffd400}
.hs{display:block;transition:transform .2s;transform:rotate(var(--ur,0deg))}
.hs.past{opacity:.4}.hs.cur{opacity:1;transform:rotate(var(--ur,0deg)) scale(1.6);filter:drop-shadow(0 0 4px rgba(255,176,0,.95))}
.me svg{display:block;transition:transform .3s;filter:drop-shadow(0 0 3px #000)}
</style></head><body>
<section id="pick">
 <h1>Nawigator Rzeszów</h1>
 <div id="warn"></div>
 <select id="br" aria-label="Linia"></select>
 <div class="chips" id="vars"></div>
 <div id="trips"></div>
</section>
<section id="drive">
 <div id="mapw"><div id="map"></div><div id="attr">© OpenStreetMap</div></div><div id="man"><span id="mt"></span><span id="st"></span></div><div id="list"></div>
 <div id="bar"><button id="back">Kursy</button><button id="prev">◀</button><button id="next">▶</button><button id="fol" aria-pressed="false">Nie wyśrodkowano</button><button id="snd" aria-pressed="false">Głos: wył.</button></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let ang=0,sa=[],lastAnn=-1,mk=[],hd=0,lp=null,rt={},rtT=0,snd=false,cd=[],mn=[],al=0,started=false,said={},auds={},D,T=[],trip,cur=0,map,lay,me,follow=true,stale=false,wl;
const fmt=s=>{s%=86400;return String(s/3600|0).padStart(2,'0')+':'+String(s%3600/60|0).padStart(2,'0')};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function active(){
 const n=new Date(),ds=''+n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0'),wd=(n.getDay()+6)%7,on=new Set(),inr=ds>=D.feed[0]&&ds<=D.feed[1];
 for(const[id,c]of Object.entries(D.cal))if(ds>=c[7]&&ds<=c[8]&&c[wd])on.add(id)
 for(const[id,d,t]of D.exc)if(d===ds){t==1?on.add(id):on.delete(id)}
 if(!inr){stale=true;for(const[id,d,t]of D.exc)if(t==1&&(new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6)).getDay()+6)%7===wd)on.add(id);for(const[id,c]of Object.entries(D.cal))if(c[wd]&&c[8]-c[7]>7)on.add(id)}
 return on}
const d8=s=>s.slice(6)+'.'+s.slice(4,6)+'.'+s.slice(0,4);
async function init(){
 D=await (await fetch('data.json')).json();
 const on=active();T=D.trips.filter(t=>on.has(t[2]));
 if(stale)$('#warn').append(Object.assign(el('div','warn','Rozkład w pliku obowiązywał '+d8(D.feed[0])+'–'+d8(D.feed[1])+'. Pokazuję układ tygodniowy z tego okresu. Wgraj świeży data.json (build_data.py).')));
 const bs=[...new Set(T.map(t=>t[0]))].sort((a,b)=>a.localeCompare(b,'pl',{numeric:true}));
 for(const b of bs)$('#br').append(new Option('Linia '+b,b));
 const sv=localStorage.getItem('br');if(sv&&bs.includes(sv))$('#br').value=sv;
 $('#br').onchange=()=>{localStorage.setItem('br',$('#br').value);vars()};vars()}
let vr='';
function vars(){
 const b=$('#br').value,vs=[...new Set(T.filter(t=>t[0]===b).map(t=>t[1]))].sort();
 if(!vs.includes(vr))vr=vs[0];$('#vars').replaceChildren();
 for(const v of vs){const c=el('button','chip','Brygada '+(v||'—'));c.setAttribute('aria-pressed',v===vr);c.onclick=()=>{vr=v;vars()};$('#vars').append(c)}
 $('#trips').replaceChildren();
 for(const t of T.filter(t=>t[0]===b&&t[1]===vr).sort((a,b)=>a[7][0]-b[7][0])){
  const r=el('button','trip');r.append(el('b',0,fmt(t[7][0])),el('span','badge',t[3]),el('span',0,t[4]),el('span','dim',fmt(t[7].at(-1))));
  r.lastChild.style.marginLeft='auto';r.onclick=()=>open(t);$('#trips').append(r)}}
function open(t){
 trip=t;cur=0;lastAnn=-1;setFol(false);started=false;al=0;said={};initShape();$('#pick').style.display='none';$('#drive').style.display='flex';
 if(!map){map=L.map('map',{zoomControl:false,attributionControl:false,touchZoom:'center'}).setView([50.04,22.0],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  map.on('dragstart',()=>setFol(false))}
 if(lay)lay.remove();lay=null;mk=[];
 setTimeout(()=>{if(trip!==t)return;map.invalidateSize();map.fitBounds(t[6].map(i=>[D.stops[i][1],D.stops[i][2]]),{padding:[20,20],animate:false});
  lay=L.layerGroup().addTo(map);const sh=D.shapes[t[5]]||[];
  if(sh.length)L.polyline(sh,{color:'#d32a00',weight:5}).addTo(lay);
  mk=t[6].map((i,k)=>L.marker([D.stops[i][1],D.stops[i][2]],{icon:L.divIcon({className:'',html:'<svg class="hs" viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="#ffd400" stroke="#0a7d3b" stroke-width="3"'+(t[8][k]?' stroke-dasharray="4.9 2.95"':'')+'/><text x="12" y="12" dy=".36em" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="14" fill="#0a7d3b">H</text></svg>',iconSize:[24,24]})}).addTo(lay));render()},60);
 gps();render();try{navigator.wakeLock?.request('screen').then(w=>wl=w)}catch(e){}}
function render(){
 if(cur!==lastAnn){lastAnn=cur;announce(cur)}
 const L_=$('#list');L_.replaceChildren();
 for(let k=cur;k<Math.min(cur+6,trip[6].length);k++){
  const r=el('div','row'+(k===cur?' now':''));
  r.append(el('time',0,fmt(trip[7][k])),el('span',0,D.stops[trip[6][k]][0]));
  if(trip[8][k])r.append(el('span','od','NA ŻĄDANIE'));else r.append(el('span','stop','STOP'));
  r.onclick=()=>{cur=k;render()};L_.append(r)}
 if(cur>=trip[6].length-1)L_.append(el('div','row dim','Przystanek końcowy kursu'));
 const n=new Date();let d=(n.getHours()*3600+n.getMinutes()*60+n.getSeconds())-trip[7][cur]%86400;const q=rt[trip[9]];if(q&&Date.now()-rtT<60000)d=q.delay;const v=-d/60,TOL=30,s=$('#st');
 s.textContent=(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2).replace('.',',')+' min'+(q&&Date.now()-rtT<60000?' · live':'');
 s.className=Math.abs(d)<=TOL?'ok':d>0?'late':'early';
 blinkUpdate();
 mk.forEach((m,k)=>{const e=m.getElement()?.firstChild;if(e){e.classList.toggle('past',k<cur);e.classList.toggle('cur',k===cur)}});
 const t=D.stops[trip[6][cur]];if(follow&&!me)map.panTo([t[1],t[2]])}
const dist=(a,b,c,d)=>Math.hypot((d-b)*Math.cos(a*Math.PI/180)*111320,(c-a)*110540);
let wid;
function gps(){
 if(wid!=null||!navigator.geolocation)return;
 wid=navigator.geolocation.watchPosition(p=>{
  const{latitude:y,longitude:x}=p.coords;
  if(!me)me=L.marker([y,x],{icon:L.divIcon({className:'',html:'<div class="me"><svg viewBox="0 0 28 28" width="30" height="30"><path d="M14 2L24 25L14 19L4 25Z" fill="#ffb000" stroke="#14171c" stroke-width="2" stroke-linejoin="round"/></svg></div>',iconSize:[30,30]})}).addTo(map),setFol(true);
  me.setLatLng([y,x]);
  const mv=lp&&dist(lp[0],lp[1],y,x)>8;let hh=p.coords.heading;
  if((hh==null||isNaN(hh))&&mv)hh=(Math.atan2((x-lp[1])*Math.cos(y*Math.PI/180),y-lp[0])*180/Math.PI+360)%360;
  if(hh!=null&&!isNaN(hh))hd=hh;if(!lp||mv)lp=[y,x];
  me.getElement().firstChild.firstChild.style.transform='rotate('+hd+'deg)';if(follow){spin(hd);map.setView(ahead(y,x),Math.max(map.getZoom(),16),{animate:false})}
  proj(y,x)
 },()=>{$('#st').textContent='brak GPS'},{enableHighAccuracy:true,maximumAge:2000})}
const MOD={left:'w lewo',right:'w prawo','slight left':'lekko w lewo','slight right':'lekko w prawo','sharp left':'ostro w lewo','sharp right':'ostro w prawo',straight:'prosto',uturn:'zawróć'};
const mtxt=m=>m[3]==='rotary'||m[3]==='roundabout'?'Na rondzie wybierz '+(m[5]||'')+'. zjazd':(m[3]==='fork'?'Na rozwidleniu trzymaj się '+(m[4].includes('left')?'lewej':'prawej'):'Skręć '+(MOD[m[4]]||m[4]))+(m[6]?', '+m[6]:'');
const say=t=>{if(!snd||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';speechSynthesis.speak(u)};
const A=new Audio();A.onerror=()=>{$('#mt').textContent='Brak pliku dźwiękowego: '+A.src.split('/').pop()};
const play=n=>{if(!snd)return;A.src='audio/'+n+'.mp3';A.play().catch(()=>{$('#snd').textContent='Głos: dotknij'})};
function announce(k){const n=trip[6].length;play(k===n-1?'przystanek_koncowy_kursu':trip[8][k]?'na_zadanie':'przystanek_obowiazkowy')}
function pr(y,x,lo,hi,first){const sh=D.shapes[trip[5]];if(!sh||sh.length<2)return[lo,1e9];const k=Math.cos(y*Math.PI/180)*111320,c=[];
 for(let i=0;i<sh.length-1;i++){if(cd[i+1]<lo||cd[i]>hi)continue;const a=sh[i],b=sh[i+1],vx=(b[1]-a[1])*k,vy=(b[0]-a[0])*110540,wx=(x-a[1])*k,wy=(y-a[0])*110540,L=vx*vx+vy*vy,t=L?Math.max(0,Math.min(1,(vx*wx+vy*wy)/L)):0;c.push([Math.hypot(wx-t*vx,wy-t*vy),cd[i]+t*Math.sqrt(L)])}
 if(!c.length)return[lo,1e9];let b=c[0];for(const z of c)if(z[0]<b[0])b=z;
 if(first)b=c.filter(z=>z[0]<=b[0]+15).reduce((p,z)=>z[1]<p[1]?z:p);return[b[1],b[0]]}
function initShape(){const sh=D.shapes[trip[5]]||[];cd=[0];for(let i=1;i<sh.length;i++)cd.push(cd[i-1]+dist(sh[i-1][0],sh[i-1][1],sh[i][0],sh[i][1]));mn=D.man[trip[5]]||[];
 sa=[];let pv=0;for(const i of trip[6]){const s=D.stops[i],r=pr(s[1],s[2],pv-30,pv+3000,0)[0];sa.push(r);pv=Math.max(pv,r)}manv()}
function proj(y,x){if(!D.shapes[trip[5]])return;const[r,d]=started?pr(y,x,al-150,al+1000,0):pr(y,x,-1,1e9,1),off=d>60;
 if(!off){al=r;started=true;advance()}manv(off);blinkUpdate()}
const BL=200; // m przed przystankiem, od których STOP mruga
function blinkUpdate(){const e=document.querySelector('#list .now .stop');if(e)e.classList.toggle('blink',started&&sa[cur]-al<=BL&&sa[cur]-al>-25)}
function advance(){let k=cur;while(k<trip[6].length-1&&sa[k]<al-25)k++;if(k!==cur){cur=k;render();announce(k)}}
function manv(off){const B=$('#mt');if(!mn.length){B.textContent='Brak sprawdzonych instrukcji skrętów dla tej trasy';return}
 const m=mn.find(m=>m[2]>al-20);if(!m){B.textContent='Dalej do końca trasy';return}
 const d=Math.max(0,Math.round((m[2]-al)/10)*10),t=mtxt(m);B.textContent=(off?'POZA TRASĄ · ':'')+(started?(d>0?'Za '+d+' m: ':'Teraz: '):'Start: ')+t;
 if(!started||off)return;const th=[30,150,400].find(h=>d<=h);
 if(th&&!said[m[2]+'_'+th]){[30,150,400].filter(h=>h>=th).forEach(h=>said[m[2]+'_'+h]=1);say(th===30?t:'Za '+th+' metrów. '+t)}}
$('#snd').onclick=e=>{snd=!snd;e.target.setAttribute('aria-pressed',snd);e.target.textContent='Głos: '+(snd?'wł.':'wył.');if(snd){say('Głos włączony');play('przystanek_obowiazkowy')}};
const RT_URL='https://www.mpkrzeszow.pl/gtfs/rt/gtfsrt.pb'; // przy błędzie CORS wstaw adres Workera (worker.js)
const td=new TextDecoder();
function pb(b){const o={};let i=0;const v=()=>{let r=0,s=0,c;do{c=b[i++];if(s<32)r|=(c&127)<<s;s+=7}while(c&128);return r>>>0};
 while(i<b.length){const k=v(),f=k>>>3,w=k&7;let x;if(w===0)x=v();else if(w===2){const n=v();x=b.subarray(i,i+n);i+=n}else if(w===5){x=new DataView(b.buffer,b.byteOffset+i,4).getFloat32(0,true);i+=4}else if(w===1){i+=8;continue}else break;(o[f]??=[]).push(x)}return o}
async function pollRT(){try{
 const b=new Uint8Array(await(await fetch(RT_URL,{cache:'no-store'})).arrayBuffer()),m={};
 for(const e of pb(b)[2]||[]){const E=pb(e);if(!E[3])continue;const tu=pb(E[3][0]);if(!tu[1])continue;const id=td.decode(pb(tu[1][0])[1][0]);
  const u=tu[2]&&pb(tu[2][0]);if(!u)continue;const dd=u[3]||u[2];m[id]={seq:u[1]?.[0],delay:dd?(pb(dd[0])[1]?.[0]|0):0}}
 rt=m;rtT=Date.now();const q=trip&&rt[trip[9]];
 if(q&&!started&&q.seq!=null){const i=trip[10]?trip[10].indexOf(q.seq):q.seq-1;if(i>=0&&i<trip[6].length)cur=i}
 if(trip)render()}catch(e){rt={}}}
pollRT();setInterval(pollRT,15000);
$('#back').onclick=()=>{$('#drive').style.display='none';$('#pick').style.display='block';wl?.release?.()};
$('#prev').onclick=()=>{cur=Math.max(0,cur-1);render()};
$('#next').onclick=()=>{cur=Math.min(trip[6].length-1,cur+1);lastAnn=cur;render();announce(cur)};
function layout(){const w=$('#mapw').clientWidth,h=$('#mapw').clientHeight,m=$('#map'),d=follow?Math.ceil(Math.hypot(w,h)):0;m.style.width=d?d+'px':'100%';m.style.height=d?d+'px':'100%';if(map)map.invalidateSize({animate:false})}
function spin(a){if(a==null)return;ang+=((a-ang)%360+540)%360-180;const m=$('#map');m.style.transform='translate(-50%,-50%) rotate('+(-ang)+'deg)';m.style.setProperty('--ur',ang+'deg')}
function ahead(y,x){const z=Math.max(map.getZoom(),16),c=Math.cos(y*Math.PI/180),m=$('#mapw').clientHeight*.2*156543*c/2**z,r=hd*Math.PI/180;return[y+Math.cos(r)*m/110540,x+Math.sin(r)*m/(111320*c)]}
function setFol(v){follow=v;const b=$('#fol');b.textContent=v?'Wyśrodkowano':'Nie wyśrodkowano';b.setAttribute('aria-pressed',v);if(!map)return;layout();
 if(v){map.dragging.disable();spin(hd);if(me){const l=me.getLatLng();map.setView(ahead(l.lat,l.lng),Math.max(map.getZoom(),16),{animate:false})}}
 else{map.dragging.enable();ang=0;const m=$('#map');m.style.transform='translate(-50%,-50%) rotate(0deg)';m.style.setProperty('--ur','0deg')}}
$('#fol').onclick=()=>setFol(!follow);
addEventListener('resize',layout);
if(window.ResizeObserver)new ResizeObserver(layout).observe($('#mapw'));
addEventListener('gesturestart',e=>e.preventDefault());
setInterval(()=>{if(trip&&$('#drive').style.display==='flex')render()},30000);
init().catch(e=>{$('#warn').textContent='Nie wczytano data.json: '+e.message});
</script></body></html>
